poll_interval_minutes: 20
jitter_seconds: 60
request_timeout_seconds: 15
max_items_per_feed: 100
max_article_age_days: 7
user_agent: "fundwatch/0.1 (personal funding alert bot)"

feeds:
  - name: Entrackr
    url: https://entrackr.com/rss
  - name: Inc42
    url: https://inc42.com/feed/
  - name: YourStory
    url: https://yourstory.com/feed
  - name: YourStory Funding
    url: https://yourstory.com/category/funding/feed
  - name: YourStory Startups
    url: https://yourstory.com/category/startups/feed
  - name: Tech in Asia
    url: https://www.techinasia.com/feed
  - name: TechCrunch Startups
    url: https://techcrunch.com/category/startups/feed/
  - name: Crunchbase News
    url: https://news.crunchbase.com/feed/

find_founder_emails: true

filters:
  india_only: true
  early_stage_only: true
  funding_keywords:
    - raises
    - raised
    - raise
    - funding
    - seed round
    - pre-seed
    - pre-series a
    - series a
    - series b
    - bags
    - secures
    - lands
    - pockets
  match_in_summary: false
  sector_keywords: []
  geo_keywords:
    - india
    - indian
    - bengaluru
    - bangalore
    - mumbai
    - delhi
    - new delhi
    - gurugram
    - gurgaon
    - noida
    - hyderabad
    - chennai
    - pune
    - coimbatore
    - kochi
    - kerala
    - ahmedabad
    - jaipur
  exclude_keywords:
    - webinar
    - podcast
    - opinion

notifiers:
  - type: telegram
    enabled: false
  - type: slack
    enabled: false
  - type: ntfy
    enabled: false
    topic: my-fundwatch-topic
  - type: email
    enabled: false

llm_extraction:
  enabled: false
  model: "claude-sonnet-5-5"
  max_tokens: 400
